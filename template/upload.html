<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        body { text-align: center; margin-top: 50px; font-family: Arial; }
        nav { background: #333; padding: 10px; }
        nav a { color: white; text-decoration: none; margin: 0 15px; }
        nav a:hover { text-decoration: underline; }
        input { padding: 10px; width: 300px; }
        button { padding: 10px 20px; margin-left: 10px; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="/">🎤 Record Audio</a>
        <a href="/youtube">🎵 YouTube to MP3</a>
        <a href="/upload">Upload</a>
        <a href="/recognize">Recognize</a>
    </nav>
    <h1>Upload Audio File</h1>
    <form action="/upload_file" method="post" enctype="multipart/form-data">
        <label for="file">Choose an audio file:</label>
        <input type="file" name="file" accept="audio/*" required>
        <br><br>
        <label for="filename">Save as (optional):</label>
        <input type="text" name="filename" placeholder="my_song.mp3">
        <br><br>
        <input type="submit" value="Upload">
    </form>
    <br>
    <a href="/">Back to Home</a>
</body>
</html>
